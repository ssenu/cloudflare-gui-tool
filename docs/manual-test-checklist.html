<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수동 통합 테스트 체크리스트</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --panel2: #1f2330; --border: #2a2f3f;
    --text: #e8eaf0; --muted: #9aa1b5; --accent: #f6821f; --accent2: #4c9aff;
    --green: #3fb950; --yellow: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; line-height: 1.8; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
  header { border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 24px; }
  header h1 { font-size: 1.8rem; }
  header p { color: var(--muted); margin-top: 6px; }
  .status { border-left: 3px solid var(--yellow); background: rgba(210,153,34,.08); padding: 10px 16px; border-radius: 0 8px 8px 0; margin: 16px 0 28px; color: var(--yellow); font-weight: 600; }
  h2 { font-size: 1.25rem; margin: 32px 0 12px; padding-left: 12px; border-left: 4px solid var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 20px; }
  label.item { display: flex; gap: 12px; align-items: flex-start; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  label.item:last-child { border-bottom: none; }
  label.item input { margin-top: 6px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  label.item input:checked + span { color: var(--muted); text-decoration: line-through; }
  code { background: var(--panel2); padding: 1px 7px; border-radius: 4px; font-family: 'Cascadia Code', Consolas, monospace; font-size: .88em; color: #ffd28e; }
  .note { color: var(--muted); font-size: .9rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>✅ 수동 통합 테스트 체크리스트</h1>
  <p>릴리스 전 실제 cloudflared로 전 과정을 확인한다.</p>
</header>

<div class="status">⚠ 상태: 미수행 — 앱 실행 후 사용자가 직접 확인 필요</div>

<h2>로컬</h2>
<div class="card">
  <label class="item"><input type="checkbox"><span>앱 시작 → 온보딩 없이 메인 진입 (설치+로그인 완료 상태)</span></label>
  <label class="item"><input type="checkbox"><span>기존 터널이 카드로 표시된다</span></label>
  <label class="item"><input type="checkbox"><span>＋ → 마법사: 이름/도메인/서비스 입력, 각 단계 명령 미리보기 표시</span></label>
  <label class="item"><input type="checkbox"><span>생성 완료 → 카드 등장, <code>config-&lt;이름&gt;.yml</code> 생성 확인</span></label>
  <label class="item"><input type="checkbox"><span>▶ 켜기 → 🟡 → 🟢 (로그에 "Registered tunnel connection")</span></label>
  <label class="item"><input type="checkbox"><span>브라우저에서 &lt;서브도메인&gt;.&lt;도메인&gt; 접속 → 로컬 서비스 응답</span></label>
  <label class="item"><input type="checkbox"><span>웹서버 ▶ → uvicorn 시작, 로그 뷰어 웹서버 탭에 출력</span></label>
  <label class="item"><input type="checkbox"><span>"함께 시작" 체크 시 터널 켜면 서버도 시작</span></label>
  <label class="item"><input type="checkbox"><span>Ctrl+1 토글 동작</span></label>
  <label class="item"><input type="checkbox"><span>■ 끄기 → ⚪, 프로세스 종료 확인</span></label>
  <label class="item"><input type="checkbox"><span>잘못된 이름/서브도메인 입력 시 마법사가 막는다</span></label>
  <label class="item"><input type="checkbox"><span>이미 존재하는 터널 이름 → 오류 메시지</span></label>
  <label class="item"><input type="checkbox"><span>⋮ → 편집: 서비스 주소 변경 → yml 반영</span></label>
  <label class="item"><input type="checkbox"><span>⋮ → 삭제: 확인 후 터널/설정 제거</span></label>
  <label class="item"><input type="checkbox"><span>창 닫기: 실행 중이면 확인 다이얼로그 → 전체 정리</span></label>
</div>

<h2>원격 (Rpi)</h2>
<div class="card">
  <label class="item"><input type="checkbox"><span>설정 → SSH 프로필 추가 → 연결 테스트 성공</span></label>
  <label class="item"><input type="checkbox"><span>대상 전환 → Rpi 터널 목록 표시</span></label>
  <label class="item"><input type="checkbox"><span>원격 터널 생성/켜기/끄기/삭제</span></label>
  <label class="item"><input type="checkbox"><span>SSH 끊김 시 배너 표시, 로컬로 복귀</span></label>
  <label class="item"><input type="checkbox"><span>대상을 로컬로 되돌리면 로컬 목록 복원</span></label>
</div>

<p class="note">※ 체크 상태는 저장되지 않는 열람용 페이지입니다. 공식 기록은 동명 md 파일에 남겨주세요.</p>

</div>
</body>
</html>
